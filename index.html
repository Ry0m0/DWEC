<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Juego</title>
  <!-- IMPORTANTE: El script se carga en el HEAD con 'defer' para que espere a que el HTML esté listo -->
  <script src="script.js" defer></script>
</head>

<body>
  <!-- Formulario de registro -->
  <input type="text" id="nombre" placeholder="Nombre">
  <input type="date" id="fecha">
  <button id="boton">Entrar</button>
  <p id="mensaje"></p>

  <!-- Panel de información del jugador -->
  <div id="panel"></div>

  <!-- Zona de juego -->
  <button id="atacar">Atacar</button>
  <p id="puntos">Puntos: 0</p>

  <!-- Botón para abrir la ventana adicional -->
  <button id="btnAyuda">Abrir Ventana de Ayuda</button>
</body>

</html>
