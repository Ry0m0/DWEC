<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ayuda</title>
</head>

<body>
    <h2>Ayuda del Juego</h2>
    <p id="mensajeAyuda"></p>

    <script>
        // Recibimos los datos de la ventana principal mediante la URL
        // URLSearchParams analiza la dirección (ej: ayuda.html?nombre=JUAN)
        const params = new URLSearchParams(window.location.search);
        const nombreRecibido = params.get("nombre");

        // Si el nombre no está vacío, mostramos el mensaje personalizado
        if (nombreRecibido) {
            document.getElementById("mensajeAyuda").textContent = "¡Hola " + nombreRecibido + "! Haz clic en Atacar para ganar puntos.";
        } else {
            document.getElementById("mensajeAyuda").textContent = "Hola desconocido.";
        }
    </script>
</body>

</html>
